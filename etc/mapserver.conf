#
# MapServer 8 config file (see https://mapserver.org/mapfile/config.html)
#
# Values in ENV take precedence over the container environment. Replace this file
# (or point MAPSERVER_CONFIG_FILE elsewhere) to change them.
#
# Under FastCGI, the environment MapServer reads on each request (getenv, also
# behind CPLGetConfigOption) is the set of FastCGI parameters of that request,
# so a client that talks FastCGI to port 8080 can set any option missing from
# ENV. Every option that decides which file is opened is pinned here, to its
# MapServer default when there is one.
#
# Strings: the lexer turns \\ into \ and keeps a \ followed by any other
# character, and the regexes are PCRE2, where [/\] is an unterminated class:
# write \\\\ for the regex \\ (a literal backslash in a class) and \. for \.
#
CONFIG
  ENV
    # required to reference mapfiles by path (map=/var/lib/mapserver/...)
    MS_MAP_PATTERN "^/var/lib/mapserver/"
    # MapServer defaults ("//", "/../" and "," in map=; *.map files only)
    MS_MAP_BAD_PATTERN "[/\\\\]{2}|[/\\\\]?\.+[/\\\\]|,"
    MS_MAPFILE_PATTERN "\.map$"
    # no default mapfile: a request without map= fails ("Filename validation
    # failed"); without this line a client could pick any file as MS_MAPFILE,
    # which is not checked against MS_MAP_PATTERN
    MS_MAPFILE ""
    # map context files (context=) stay disabled: nothing matches "^$"
    MS_CONTEXT_PATTERN "^$"
    MS_CONTEXT_BAD_PATTERN "[/\\\\]{2}|[/\\\\]?\.+[/\\\\]|,"
    OGCAPI_HTML_TEMPLATE_DIRECTORY "/opt/geosgb/share/mapserver/ogcapi/templates/html-bootstrap/"
  END

  MAPS
    DEFAULT "/var/lib/mapserver/data/default.map"
  END
END
