name: Publish image

on:
  # manual, and also dispatched by the CI of gdal-oci after it publishes new ndscprm/gdal images, with their
  # full names. There is no scheduled rebuild: a new base image invalidates every layer, so apt fetches the
  # current packages then
  workflow_dispatch:
    # full names of the ndscprm/gdal images to build on (the CI of gdal-oci sends the dated tags it has just
    # published, pinned by digest: <tag>-<YYYYMMDD>@sha256:...). Every derived image declares the same
    # three inputs, so gdal-oci sends the same set to all of them; each uses those its Dockerfile needs.
    # Empty = the ARG default of the Dockerfile (a moving tag)
    inputs:
      image_devel:
        description: ndscprm/gdal devel image (GDAL_IMAGE_DEVEL). Empty = Dockerfile default
        required: false
        default: ""
      image_py:
        description: ndscprm/gdal image with Python (GDAL_IMAGE_PY). Empty = Dockerfile default
        required: false
        default: ""
      image_nopy:
        description: ndscprm/gdal image without Python (GDAL_IMAGE_NOPY). Empty = Dockerfile default
        required: false
        default: ""
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]

# Least privilege for GITHUB_TOKEN; the image job grants what the reusable workflow needs
permissions:
  contents: read

# one build at a time, so two runs never push the same tags in parallel; a running build is never cancelled
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # the inputs must name ndscprm/gdal images: a manual run could otherwise build on any image.
  # Also gives the Python version of the devel and release-mapscript bases, part of their tags
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      python: ${{ steps.python.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          IMAGES: ${{ inputs.image_devel }} ${{ inputs.image_py }} ${{ inputs.image_nopy }}
        run: |
          for image in $IMAGES; do
              case $image in
                  docker.io/ndscprm/gdal:*) echo "base image: $image" ;;
                  *)
                      echo "::error::not a docker.io/ndscprm/gdal image: $image"
                      exit 1
                      ;;
              esac
          done

      # major.minor from the -py<X.Y> of the devel and py images given, or of the ARG defaults
      # (docker.io/ndscprm/gdal:3.12.4-py3.12-20261026@sha256:... -> 3.12). Both must have the same
      # Python: the MapScript wheel built in the devel is installed in release-mapscript
      - name: Python version
        id: python
        env:
          IMAGE_DEVEL: ${{ inputs.image_devel }}
          IMAGE_PY: ${{ inputs.image_py }}
        run: |
          python=
          for arg in GDAL_IMAGE_DEVEL GDAL_IMAGE_PY; do
              case $arg in
                  GDAL_IMAGE_DEVEL) image=$IMAGE_DEVEL ;;
                  GDAL_IMAGE_PY) image=$IMAGE_PY ;;
              esac
              image=${image:-$(sed -n "s/^ARG ${arg}=//p" Dockerfile)}
              py=$(printf '%s\n' "$image" | sed -nE 's/^[^:]*:[^@]*-py([0-9]+\.[0-9]+)([-@].*)?$/\1/p')
              if [ -z "$py" ]; then
                  echo "::error::no -py<major.minor> in the tag of $image ($arg)"
                  exit 1
              fi
              if [ -n "$python" ] && [ "$py" != "$python" ]; then
                  echo "::error::Python $py in $image ($arg), but $python in the devel image"
                  exit 1
              fi
              python=$py
              echo "Python $py ($arg: $image)"
          done
          echo "python=${python}" >> "$GITHUB_OUTPUT"

  # Build, test, scan and tags in the reusable workflow of the base image (README of gdal-oci,
  # "Workflow reutilizável"): native runners per architecture, push by digest, tags only after the
  # tests and scans of both architectures
  image:
    needs: check
    uses: nds-cprm/gdal-oci/.github/workflows/reusable-publish-image.yml@main
    permissions:
      contents: read
      # upload of the SARIF reports to code scanning (actions: read is also needed in private repositories)
      actions: read
      security-events: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      image: docker.io/ndscprm/mapserver
      version-arg: MAPSERVER_VERSION
      # base images given by gdal-oci when it starts this workflow (the images it has just published);
      # empty lines are ignored, so without them the ARG defaults of the Dockerfile are built
      build-args: |
        ${{ inputs.image_devel && format('GDAL_IMAGE_DEVEL={0}', inputs.image_devel) || '' }}
        ${{ inputs.image_py && format('GDAL_IMAGE_PY={0}', inputs.image_py) || '' }}
        ${{ inputs.image_nopy && format('GDAL_IMAGE_NOPY={0}', inputs.image_nopy) || '' }}
      # devel, mapscript and release come from the same Bake call, so they share the compile stage (same
      # MapServer build); the release goes through every stage it needs (COPY --from=build and staging), so it
      # writes the cache. mapscript (release-mapscript) is the release FastCGI server on the GDAL base with
      # Python plus Python MapScript: the smoke test of the release, then its own. The tags of devel and
      # mapscript, which have Python and MapScript, carry its version (<version>-py<X.Y>-devel/-mapscript).
      # Vulnerabilities are only reported (no fail-on-severity), but a failed scan stops the publication
      variants: |
        [
          {"name": "devel", "target": "build", "tag": "{version}-py${{ needs.check.outputs.python }}-devel",
           "test": "sh .github/scripts/devel-test.sh \"$IMAGE_REF\""},
          {"name": "mapscript", "target": "release-mapscript", "tag": "{version}-py${{ needs.check.outputs.python }}-mapscript", "scan": true,
           "test": "sh .github/scripts/smoke-test.sh \"$IMAGE_REF\" && sh .github/scripts/mapscript-test.sh \"$IMAGE_REF\""},
          {"name": "release", "target": "release", "tag": "{version}", "scan": true, "cache-to": true,
           "test": "sh .github/scripts/smoke-test.sh \"$IMAGE_REF\""}
        ]
