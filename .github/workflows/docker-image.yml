name: Docker Image CI

on:
  workflow_dispatch:
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]
  #schedule:
  #- cron: "0 2 * * 1-5"

# Least privilege for GITHUB_TOKEN; the image job grants what the reusable workflow needs
permissions:
  contents: read

# one build at a time, so two runs never push the same tags in parallel; a running build is never cancelled
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Build, test, scan and tags in the reusable workflow of the base image (README of gdal-oci,
  # "Workflow reutilizável"): native runners per architecture, push by digest, tags only after the
  # tests and scans of both architectures
  image:
    uses: nds-cprm/gdal-oci/.github/workflows/oci-image.yml@main
    permissions:
      contents: read
      # upload of the SARIF reports to code scanning (actions: read is also needed in private repositories)
      actions: read
      security-events: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      image: docker.io/ndscprm/mapserver
      version-arg: MAPSERVER_VERSION
      # devel and release come from the same Bake call, so they share the compile stage (same MapServer
      # build); the release goes through every stage (COPY --from=build), so it writes the cache.
      # Vulnerabilities are only reported (no fail-on-severity), but a failed scan stops the publication
      variants: |
        [
          {"name": "devel", "target": "build", "tag": "{version}-devel",
           "test": "sh .github/scripts/devel-test.sh \"$IMAGE_REF\""},
          {"name": "release", "target": "release", "tag": "{version}", "scan": true, "cache-to": true,
           "test": "sh .github/scripts/smoke-test.sh \"$IMAGE_REF\""}
        ]
