name: Docker Image CI

on:
  # manual, and also dispatched by the CI of gdal-oci after it publishes new ndscprm/gdal tags, with their
  # versions in gdal_version and python_version. There is no scheduled rebuild: a new base image invalidates
  # every layer, so apt fetches the current packages then
  workflow_dispatch:
    inputs:
      gdal_version:
        description: ndscprm/gdal GDAL version (base image tags). Empty = ARG GDAL_VERSION in the Dockerfile
        required: false
        default: ""
      python_version:
        description: ndscprm/gdal Python version (base image tags). Empty = ARG PYTHON_VERSION in the Dockerfile
        required: false
        default: ""
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]

# Least privilege for GITHUB_TOKEN; the image job grants what the reusable workflow needs
permissions:
  contents: read

# one build at a time, so two runs never push the same tags in parallel; a running build is never cancelled
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Build, test, scan and tags in the reusable workflow of the base image (README of gdal-oci,
  # "Workflow reutilizável"): native runners per architecture, push by digest, tags only after the
  # tests and scans of both architectures
  image:
    uses: nds-cprm/gdal-oci/.github/workflows/oci-image.yml@main
    permissions:
      contents: read
      # upload of the SARIF reports to code scanning (actions: read is also needed in private repositories)
      actions: read
      security-events: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      image: docker.io/ndscprm/mapserver
      version-arg: MAPSERVER_VERSION
      # base image versions given by gdal-oci when it starts this workflow (the tags it has just published);
      # empty lines are ignored, so without them the ARG defaults of the Dockerfile are built
      build-args: |
        ${{ inputs.gdal_version && format('GDAL_VERSION={0}', inputs.gdal_version) || '' }}
        ${{ inputs.python_version && format('PYTHON_VERSION={0}', inputs.python_version) || '' }}
      # devel, mapscript and release come from the same Bake call, so they share the compile stage (same
      # MapServer build); the release goes through every stage it needs (COPY --from=build and staging), so it
      # writes the cache. mapscript (release-mapscript) is the release FastCGI server on the GDAL base with
      # Python plus Python MapScript: the smoke test of the release, then its own.
      # Vulnerabilities are only reported (no fail-on-severity), but a failed scan stops the publication
      variants: |
        [
          {"name": "devel", "target": "build", "tag": "{version}-devel",
           "test": "sh .github/scripts/devel-test.sh \"$IMAGE_REF\""},
          {"name": "mapscript", "target": "release-mapscript", "tag": "{version}-mapscript", "scan": true,
           "test": "sh .github/scripts/smoke-test.sh \"$IMAGE_REF\" && sh .github/scripts/mapscript-test.sh \"$IMAGE_REF\""},
          {"name": "release", "target": "release", "tag": "{version}", "scan": true, "cache-to": true,
           "test": "sh .github/scripts/smoke-test.sh \"$IMAGE_REF\""}
        ]
